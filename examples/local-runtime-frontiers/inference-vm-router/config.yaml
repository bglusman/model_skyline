# RTX 5060 Ti 16 GB inference VM: one LAN endpoint and one GPU-memory owner.
healthCheckTimeout: 600
unloadTimeout: 20
globalTTL: 300
startPort: 8180
includeAliasesInList: true
logLevel: info
logToStdout: both
sendLoadingState: false

models:
  qwen35-9b-q6k-ctx128k-q8kv-load-none:
    name: Qwen3.5 9B Q6_K 128K Q8 KV (llama.cpp)
    cmd: >-
      /usr/local/libexec/model-skyline/local-model-exclusive
      /opt/llama-cpp/build-5266f24/bin/llama-server
      --model /opt/models/model-skyline/Qwen3.5-9B-Q6_K.gguf
      --alias qwen35-9b-q6k-ctx128k-q8kv-load-none
      --host 127.0.0.1 --port ${PORT}
      --ctx-size 131072 --parallel 1
      --batch-size 2048 --ubatch-size 512
      --threads 6 --threads-batch 6
      --n-gpu-layers all --flash-attn on
      --cache-type-k q8_0 --cache-type-v q8_0
      --fit off --load-mode none --cache-ram 0
      --jinja --reasoning off --reasoning-format none
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    ttl: 900
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 131072

  muse-glimmer-30b-ad-iq3xxs-ctx128k-q4kv-load-none:
    name: Muse Glimmer 30B AD-IQ3_XXS 128K Q4 KV (llama.cpp)
    cmd: >-
      /usr/local/libexec/model-skyline/local-model-exclusive
      /opt/llama-cpp/build-5266f24/bin/llama-server
      --model /opt/models/model-skyline/Muse-Glimmer-30B-AD-IQ3_XXS.gguf
      --alias muse-glimmer-30b-ad-iq3xxs-ctx128k-q4kv-load-none
      --host 127.0.0.1 --port ${PORT}
      --ctx-size 131072 --parallel 1
      --batch-size 2048 --ubatch-size 512
      --threads 6 --threads-batch 6
      --n-gpu-layers all --flash-attn on
      --cache-type-k q4_0 --cache-type-v q4_0
      --fit off --load-mode none --cache-ram 0
      --jinja
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    ttl: 900
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 131072

  qwen3.5:9b:
    name: Qwen3.5 9B Q4_K_M (Ollama control)
    cmd: /usr/local/libexec/model-skyline/llama-swap-ollama-hold
    cmdStop: /usr/local/libexec/model-skyline/llama-swap-ollama-stop ${PID} qwen3.5:9b
    proxy: http://127.0.0.1:11434
    checkEndpoint: /api/tags
    ttl: 300
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 16384

  qwen3-embedding:0.6b:
    name: Qwen3 Embedding 0.6B Q8_0 (Ollama)
    cmd: /usr/local/libexec/model-skyline/llama-swap-ollama-hold
    cmdStop: /usr/local/libexec/model-skyline/llama-swap-ollama-stop ${PID} qwen3-embedding:0.6b
    proxy: http://127.0.0.1:11434
    checkEndpoint: /api/tags
    ttl: 300

  Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice:
    name: Qwen3-TTS 1.7B CustomVoice BF16 (Nari consumer profile)
    cmd: /usr/local/libexec/model-skyline/nari-qwen3-tts-consumer ${PORT}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /ready
    ttl: 300
    capabilities:
      in: [text]
      out: [audio]

routing:
  router:
    use: group
    settings:
      groups:
        local-memory:
          swap: true
          exclusive: true
          members:
            - qwen35-9b-q6k-ctx128k-q8kv-load-none
            - muse-glimmer-30b-ad-iq3xxs-ctx128k-q4kv-load-none
            - qwen3.5:9b
            - qwen3-embedding:0.6b
            - Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
