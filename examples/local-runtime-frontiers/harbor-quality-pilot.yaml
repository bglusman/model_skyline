implementation_equivalence_checks:
  - candidate_route: qwen3.8-27b-oq4e-mtp:dflash2-tq4
    anchor_route: qwen3.8-27b-oq4e-mtp:baseline-f16kv
    purpose: detect_semantic_regression_before_treating_speculation_as_equivalent
  - candidate_route: muse-glimmer-30b-dynamic-dflash2
    anchor_route: muse-glimmer-30b-dynamic-target
    purpose: retain_as_experimental_until_cold_and_warm_task_results_agree

phases:
  - name: harness_smoke
    task_set: smoke
    attempts_per_task: 1
    candidates: [qwen38_baseline, ornith15_baseline, qwen38_flash_ds4, muse_glimmer_target]
    promotion: every_trial_has_valid_verifier_evidence
  - name: stratified_pilot
    task_set: pilot_5
    attempts_per_task: 1
    candidates: [qwen38_baseline, ornith15_baseline, qwen38_flash_ds4, muse_glimmer_target]
    promotion: result_can_change_any_pilot_frontier_or_default_fallback_order
  - name: repeated_pilot
    task_set: pilot_5
    attempts_per_task: 5
    candidates: promoted_only
    promotion: uncertainty_interval_can_change_frontier_membership
  - name: complete_benchmark
    task_set: all_89
    attempts_per_task: 5
    candidates: promoted_only
    evidence_tier: measured

validity_gates:
  - exact_task_digest_matches_manifest
  - exact_model_artifact_and_runtime_profile_recorded
  - trial_exception_is_absent_or_protocol_quality_attributable
  - verifier_result_present
  - verifier_ctrf_artifact_present_and_parseable
  - reward_matches_ctrf_test_outcome
  - trajectory_and_result_raw_hashes_retained
  - no_llama_swap_loading_events_in_model_history
  - memory_capture_job_lock_hash_matches_quality_summary
  - memory_frontier_uses_only_tasks_sampled_before_agent_execution

pilot_frontiers:
  agent_quality_latency:
    axes:
      - metric: pilot_task_success_percent
        goal: maximize
      - metric: p95_task_wall_seconds
        goal: minimize
        epsilon_relative: "0.05"
    eligibility:
      minimum_success_percent: "60"
      exact_task_set_required: true
  agent_quality_memory:
    axes:
      - metric: pilot_task_success_percent
        goal: maximize
      - metric: peak_process_physical_footprint_bytes
        goal: minimize
        epsilon_relative: "0.05"
    eligibility:
      minimum_success_percent: "60"
      exact_task_set_required: true
  agent_quality_cache_efficiency:
    axes:
      - metric: pilot_task_success_percent
        goal: maximize
      - metric: total_uncached_input_tokens
        goal: minimize
        epsilon_relative: "0.05"
    eligibility:
      minimum_success_percent: "60"
      exact_task_set_required: true

publication:
  smoke_results_are_quality_scores: false
  pilot_score_label: five-task measured workload, not Terminal-Bench 2.1
  full_benchmark_estimation_allowed: false
  estimator_unlock_condition: held-out quantized-artifact validation is attached
  infrastructure_invalid_trials_count_as_failures: false
  source_job_upload: private_until_trajectory_and_rights_review
