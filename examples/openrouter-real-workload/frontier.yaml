# Example: real OpenRouter catalog prices x real agent workload shape
# Cost axis: metered USD per successful agent turn (OpenRouter API-equivalent rates).
# Quality axis: Artificial Analysis Intelligence Index v4.1.1.
# Token shape: 30 days of real OpenClaw agent traces (1,336 turns, 93% success).
schema_version: model-skyline/v1alpha1

workloads:
  agent-turn-metered-v1:
    unit: successful_turn
    version: "1.0.0"
    harness: hermes-openclaw-agent@1
    cohort: openclaw-main-30day-20260830-shape
    description: Metered cost per successful agent turn across OpenRouter's
      catalog, priced at each model's live API-equivalent rates against a real
      30-day agent token shape (155k cache-read / 15k uncached / 600 output
      per successful turn).
    variables: {}
    assumptions:
      cache_mode: observed
      includes_failed_attempts: true
      pricing_mode: current_catalog_price_counterfactual
      fixture_data: real
      quality_source: artificial-analysis-index-v4.1.1

metrics:
  aa_intelligence_index:
    kind: signal
    signal: aa_intelligence_index
    unit: index
    description: Artificial Analysis Intelligence Index v4.1.1 (0-100).
    requirements:
      max_age_hours: 8760

  metered_cost_per_turn:
    kind: formula
    unit: USD/success
    description: API-metered cost of one successful agent turn at catalog rates.
    expression: >-
      (
        signals.input_uncached_tokens_per_success
          * signals.input_uncached_usd_per_million
        + signals.input_cache_read_tokens_per_success
          * signals.input_cache_read_usd_per_million
        + signals.output_tokens_per_success
          * signals.output_usd_per_million
      ) / 1000000
    requirements:
      max_age_hours: 8760

frontiers:
  openrouter-value:
    workload: agent-turn-metered-v1
    axes:
      - metric: metered_cost_per_turn
        goal: minimize
        epsilon_relative: 0.02
      - metric: aa_intelligence_index
        goal: maximize
        epsilon_absolute: 0.5
    order_by: metered_cost_per_turn
    uncertainty: point
    eligibility:
      required_capabilities: [tools, structured_output]
      allow_unknown_age: false
    metadata_fields: [aa_intelligence_index, context_window]

selections:
  openrouter-example-defaults:
    frontier: openrouter-value
    strategy: lexicographic
    count: 3
    order_by: aa_intelligence_index
    max_per_provider: 3
    snapshot_ttl_seconds: 3600
    on_insufficient: return_available
