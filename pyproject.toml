[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "model-skyline"
dynamic = ["version"]
description = "Workload-specific Pareto frontiers and dynamic model selection for agents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ModelSkyline contributors" }]
keywords = ["llm", "agents", "model-selection", "pareto", "optimization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "duckdb>=1.1,<2",
  "httpx>=0.27,<1",
  "lark>=1.2,<2",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "rfc8785>=0.1,<1",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.120,<7",
  "jsonschema>=4.23,<5",
  "mypy>=1.13,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
modelskyline = "model_skyline.cli:app"

[tool.hatch.version]
path = "src/model_skyline/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/model_skyline"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "model_skyline/schemas"

[tool.hatch.build]
exclude = [
  "/.git",
  "/.hypothesis",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/build",
  "/dist",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
